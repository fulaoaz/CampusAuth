[package]
name = "campus-auth"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Native desktop and headless campus network authentication for Ruijie ePortal"
license = "MIT"
repository = "https://github.com/fulaoaz/CampusAuth"
default-run = "campus-auth"
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "build.rs", "LICENSE", "README.md", "deploy/**", "examples/**"]

[features]
default = []

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "query"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6"
encoding_rs = "0.8"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
